name: Release

# A tag of the form v* builds the binaries and publishes a release. The
# binaries are built here rather than on a developer's machine, so that the
# archive for a platform is always the one the source produced.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build, for example v0.10.1"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows
            arch: amd64
            runner: windows-latest
          - os: windows
            arch: arm64
            runner: windows-latest
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: darwin
            arch: arm64
            runner: macos-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Work out the version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if [ -z "$tag" ]; then
            echo "no tag to build" >&2
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: |
          mkdir -p "dist/jin_${{ steps.version.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}"
          binary="jin"
          if [ "${{ matrix.os }}" = "windows" ]; then
            binary="jin.exe"
          fi
          CGO_ENABLED=0 GOOS="${{ matrix.os }}" GOARCH="${{ matrix.arch }}" \
            go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.version.outputs.version }}" \
            -o "dist/jin_${{ steps.version.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}/$binary" .
          cp LICENSE LICENSE-APACHE README.md CHANGELOG.md \
            "dist/jin_${{ steps.version.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}/"

      - name: Check the binary runs
        shell: bash
        run: |
          dir="dist/jin_${{ steps.version.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}"
          if [ "${{ matrix.os }}" = "windows" ]; then
            "$dir/jin.exe" --version
          else
            "$dir/jin" --version
          fi

      - name: Package
        shell: bash
        run: |
          dir="dist/jin_${{ steps.version.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}"
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            zip -r "$dir.zip" "$dir"
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi

      - name: Checksums
        shell: bash
        run: |
          cd dist
          if [ "${{ matrix.os }}" = "windows" ]; then
            pattern="*.zip"
          else
            pattern="*.tar.gz"
          done
          for file in $pattern; do
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$file" >> SHA256SUMS.txt
            else
              shasum -a 256 "$file" >> SHA256SUMS.txt
            fi
          done

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: "jin-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}"
          path: |
            dist/jin_${{ steps.version.outputs.version }}_${{ matrix.os }}_${{ matrix.arch }}.*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Download every archive
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Work out the version
        id: version
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Make the checksum file
        shell: bash
        run: |
          cd artifacts
          ls -1 *.zip *.tar.gz | sort > files.txt
          : > SHA256SUMS.txt
          while read -r file; do
            sha256sum "$file" >> SHA256SUMS.txt
          done < files.txt

      - name: Write the release notes
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The notes are the section of the changelog for this version, so
          # that the release says the same thing the changelog does.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            /^## \[/ { inside = 0 }
            inside { print }
          ' CHANGELOG.md > section.md

          {
            echo "The changes in this release:"
            echo
            if [ -s section.md ]; then
              cat section.md
            else
              echo "See the changelog for the full list."
            fi
            echo
            echo "The whole list is in [CHANGELOG.md](https://github.com/jojin1709/jin/blob/main/CHANGELOG.md)."
          } > body.md

          cat body.md

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "Jin $TAG" \
            --notes-file body.md \
            artifacts/*.zip \
            artifacts/*.tar.gz \
            artifacts/SHA256SUMS.txt
